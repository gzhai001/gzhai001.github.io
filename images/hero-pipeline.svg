<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 320" font-family="-apple-system, Helvetica, Arial, sans-serif" role="img" aria-label="Research overview: multimodal data feed causal inference and machine learning methods, which inform safer transportation systems and sustainable shared mobility">
  <defs>
    <marker id="hz-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8288"/>
    </marker>
    <linearGradient id="hz-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fafc"/>
      <stop offset="1" stop-color="#e8f4f8"/>
    </linearGradient>
  </defs>

  <!-- Left: data sources -->
  <g font-size="13" fill="#494e52">
    <rect x="20" y="30" rx="10" ry="10" width="200" height="62" fill="#f2f5f7" stroke="#9baeb8" stroke-width="1.5"/>
    <text x="120" y="56" text-anchor="middle" font-weight="600">Crash &amp; safety records</text>
    <text x="120" y="76" text-anchor="middle" font-size="11.5" fill="#7a8288">policies, exposure, severity</text>

    <rect x="20" y="128" rx="10" ry="10" width="200" height="62" fill="#f2f5f7" stroke="#9baeb8" stroke-width="1.5"/>
    <text x="120" y="154" text-anchor="middle" font-weight="600">Behavioral big data</text>
    <text x="120" y="174" text-anchor="middle" font-size="11.5" fill="#7a8288">GPS trajectories, transactions</text>

    <rect x="20" y="226" rx="10" ry="10" width="200" height="62" fill="#f2f5f7" stroke="#9baeb8" stroke-width="1.5"/>
    <text x="120" y="252" text-anchor="middle" font-weight="600">Stated choices &amp; surveys</text>
    <text x="120" y="272" text-anchor="middle" font-size="11.5" fill="#7a8288">conjoint, SP experiments</text>
  </g>

  <!-- Middle: methods hub -->
  <rect x="300" y="78" rx="14" ry="14" width="330" height="164" fill="url(#hz-mid)" stroke="#52adc8" stroke-width="2"/>
  <text x="465" y="106" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#2f6f83">Causal Inference × Machine Learning</text>
  <g font-size="12" fill="#494e52">
    <rect x="320" y="124" rx="8" ry="8" width="145" height="34" fill="#fff" stroke="#b9d2dc"/>
    <text x="392" y="145" text-anchor="middle">propensity scores</text>
    <rect x="320" y="166" rx="8" ry="8" width="145" height="34" fill="#fff" stroke="#b9d2dc"/>
    <text x="392" y="187" text-anchor="middle">diff.-in-differences</text>
    <rect x="320" y="208" rx="8" ry="8" width="145" height="34" fill="#fff" stroke="#b9d2dc"/>
    <text x="392" y="229" text-anchor="middle">doubly robust est.</text>
    <rect x="473" y="124" rx="8" ry="8" width="142" height="34" fill="#fff" stroke="#b9d2dc"/>
    <text x="544" y="145" text-anchor="middle">Bayesian ML (BART)</text>
    <rect x="473" y="166" rx="8" ry="8" width="142" height="34" fill="#fff" stroke="#b9d2dc"/>
    <text x="544" y="187" text-anchor="middle">discrete choice models</text>
    <rect x="473" y="208" rx="8" ry="8" width="142" height="34" fill="#fff" stroke="#b9d2dc"/>
    <text x="544" y="229" text-anchor="middle">LLMs &amp; vision models</text>
  </g>

  <!-- Right: outcomes -->
  <g>
    <rect x="700" y="52" rx="12" ry="12" width="260" height="88" fill="#e8f4f8" stroke="#52adc8" stroke-width="2"/>
    <text x="830" y="82" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f6f83">Safer transportation systems</text>
    <text x="830" y="103" text-anchor="middle" font-size="11.5" fill="#4d8a9d">policy evaluation · hotspot</text>
    <text x="830" y="120" text-anchor="middle" font-size="11.5" fill="#4d8a9d">identification · equity</text>

    <rect x="700" y="180" rx="12" ry="12" width="260" height="88" fill="#e8f4f8" stroke="#52adc8" stroke-width="2"/>
    <text x="830" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#2f6f83">Sustainable shared mobility</text>
    <text x="830" y="231" text-anchor="middle" font-size="11.5" fill="#4d8a9d">mode choice · pricing &amp;</text>
    <text x="830" y="248" text-anchor="middle" font-size="11.5" fill="#4d8a9d">competition · operations</text>
  </g>

  <!-- Arrows -->
  <g stroke="#7a8288" stroke-width="1.8" fill="none">
    <line x1="222" y1="61"  x2="297" y2="110" marker-end="url(#hz-arrow)"/>
    <line x1="222" y1="159" x2="297" y2="160" marker-end="url(#hz-arrow)"/>
    <line x1="222" y1="257" x2="297" y2="210" marker-end="url(#hz-arrow)"/>
    <line x1="632" y1="120" x2="697" y2="100" marker-end="url(#hz-arrow)"/>
    <line x1="632" y1="200" x2="697" y2="220" marker-end="url(#hz-arrow)"/>
  </g>
</svg>
