<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="-apple-system, Helvetica, Arial, sans-serif" role="img" aria-label="Generative AI creates safety-critical vehicle-pedestrian interaction scenarios: latent scenario conditions are sampled and rendered into realistic crossing scenes, then validated">
  <defs>
    <marker id="sg-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#494e52"/>
    </marker>
    <marker id="sg-arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2f6f83"/>
    </marker>
  </defs>

  <!-- ======== left: top-view scene ======== -->
  <!-- sidewalks -->
  <rect x="20" y="20" width="380" height="130" rx="8" fill="#e9efe9"/>
  <rect x="20" y="250" width="380" height="130" rx="8" fill="#e9efe9"/>
  <!-- road -->
  <rect x="20" y="150" width="380" height="100" fill="#7d848a"/>
  <line x1="24" y1="200" x2="396" y2="200" stroke="#fff" stroke-width="3" stroke-dasharray="18 14" opacity="0.7"/>
  <!-- crosswalk -->
  <g fill="#f5f5f0" opacity="0.95">
    <rect x="296" y="152" width="16" height="96"/>
    <rect x="322" y="152" width="16" height="96"/>
    <rect x="348" y="152" width="16" height="96"/>
    <rect x="374" y="152" width="16" height="96"/>
  </g>

  <!-- pedestrian trajectory -->
  <path d="M 262 292 C 250 250, 258 210, 300 186" fill="none" stroke="#e07b39" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#sg-arrow)"/>
  <!-- pedestrian figure -->
  <g>
    <circle cx="262" cy="290" r="7" fill="#e07b39"/>
    <line x1="262" y1="297" x2="262" y2="316" stroke="#e07b39" stroke-width="4" stroke-linecap="round"/>
    <line x1="262" y1="304" x2="252" y2="313" stroke="#e07b39" stroke-width="3.4" stroke-linecap="round"/>
    <line x1="262" y1="316" x2="254" y2="332" stroke="#e07b39" stroke-width="3.4" stroke-linecap="round"/>
    <line x1="262" y1="316" x2="270" y2="331" stroke="#e07b39" stroke-width="3.4" stroke-linecap="round"/>
  </g>

  <!-- ego vehicle -->
  <g>
    <rect x="70" y="162" width="86" height="34" rx="10" fill="#52adc8" stroke="#2f6f83" stroke-width="1.6"/>
    <rect x="84" y="168" width="30" height="22" rx="5" fill="#d7edf4"/>
    <circle cx="92" cy="198" r="7" fill="#494e52"/>
    <circle cx="134" cy="198" r="7" fill="#494e52"/>
    <line x1="164" y1="179" x2="258" y2="179" stroke="#2f6f83" stroke-width="2.6" marker-end="url(#sg-arrow-teal)"/>
    <text x="206" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#2f6f83">v</text>
  </g>

  <!-- parameter chips -->
  <g font-size="11.5" fill="#494e52">
    <rect x="36" y="36" rx="12" ry="12" width="118" height="28" fill="#fff" stroke="#b9d2dc"/>
    <text x="95" y="54" text-anchor="middle">crossing speed</text>
    <line x1="95" y1="64" x2="250" y2="282" stroke="#b9d2dc" stroke-width="1.2"/>

    <rect x="164" y="36" rx="12" ry="12" width="112" height="28" fill="#fff" stroke="#b9d2dc"/>
    <text x="220" y="54" text-anchor="middle">approach gap</text>
    <line x1="220" y1="64" x2="180" y2="158" stroke="#b9d2dc" stroke-width="1.2"/>

    <rect x="40" y="330" rx="12" ry="12" width="100" height="28" fill="#fff" stroke="#b9d2dc"/>
    <text x="90" y="348" text-anchor="middle">yaw / angle</text>
    <line x1="130" y1="330" x2="255" y2="296" stroke="#b9d2dc" stroke-width="1.2"/>
  </g>

  <!-- safety-critical tag -->
  <g>
    <rect x="258" y="88" rx="12" ry="12" width="128" height="30" fill="#fdeee2" stroke="#e07b39" stroke-width="1.4"/>
    <path d="M 274 105 l 6 -11 l 6 11 z" fill="#e07b39"/>
    <text x="326" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#b85c1e">safety-critical</text>
  </g>

  <!-- ======== right: generative loop ======== -->
  <g font-size="12.5" fill="#494e52">
    <rect x="432" y="72" rx="10" ry="10" width="180" height="54" fill="#f2f5f7" stroke="#9baeb8" stroke-width="1.5"/>
    <text x="522" y="94" text-anchor="middle" font-weight="600">latent scenario</text>
    <text x="522" y="112" text-anchor="middle">conditions</text>

    <rect x="428" y="250" rx="10" ry="10" width="188" height="54" fill="#e8f4f8" stroke="#52adc8" stroke-width="2"/>
    <text x="522" y="272" text-anchor="middle" font-weight="600" fill="#2f6f83">realistic traffic</text>
    <text x="522" y="290" text-anchor="middle" fill="#2f6f83">scenario</text>
  </g>
  <!-- loop arrows -->
  <line x1="522" y1="130" x2="522" y2="244" stroke="#2f6f83" stroke-width="2.2" marker-end="url(#sg-arrow-teal)"/>
  <text x="538" y="192" font-size="11.5" fill="#2f6f83">generate</text>
  <path d="M 428 277 C 392 250, 392 130, 428 100" fill="none" stroke="#7a8288" stroke-width="1.8" marker-end="url(#sg-arrow)"/>
  <text x="398" y="192" font-size="11.5" fill="#7a8288" text-anchor="middle">validate</text>

  <!-- filter star -->
  <g>
    <path d="M 610 148 l 4.6 9.3 10.3 1.5 -7.5 7.3 1.8 10.2 -9.2 -4.8 -9.2 4.8 1.8 -10.2 -7.5 -7.3 10.3 -1.5 z" fill="#e07b39"/>
    <text x="598" y="205" font-size="11" fill="#b85c1e" text-anchor="middle">criticality filter</text>
  </g>
</svg>
