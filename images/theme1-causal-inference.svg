<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#494e52"/>
    </marker>
  </defs>
  <!-- Confounder node -->
  <rect x="230" y="18" rx="10" ry="10" width="180" height="52" fill="#f2f5f7" stroke="#9baeb8" stroke-width="1.5"/>
  <text x="320" y="40" text-anchor="middle" font-size="13" fill="#494e52">Confounders</text>
  <text x="320" y="58" text-anchor="middle" font-size="11.5" fill="#7a8288">built environment, exposure</text>
  <!-- Treatment node -->
  <rect x="40" y="170" rx="10" ry="10" width="200" height="60" fill="#e8f4f8" stroke="#52adc8" stroke-width="2"/>
  <text x="140" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6f83">Treatment / Policy</text>
  <text x="140" y="212" text-anchor="middle" font-size="11.5" fill="#4d8a9d">e.g., speed limit reduction</text>
  <!-- Outcome node -->
  <rect x="400" y="170" rx="10" ry="10" width="200" height="60" fill="#e8f4f8" stroke="#52adc8" stroke-width="2"/>
  <text x="500" y="194" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6f83">Safety Outcome</text>
  <text x="500" y="212" text-anchor="middle" font-size="11.5" fill="#4d8a9d">crash frequency &amp; severity</text>
  <!-- Arrows -->
  <line x1="255" y1="70" x2="160" y2="168" stroke="#494e52" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="385" y1="70" x2="480" y2="168" stroke="#494e52" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="242" y1="200" x2="398" y2="200" stroke="#2f6f83" stroke-width="2.4" marker-end="url(#arrow)"/>
  <text x="320" y="192" text-anchor="middle" font-size="11.5" font-style="italic" fill="#2f6f83">causal effect?</text>
  <!-- Methods strip -->
  <rect x="40" y="100" rx="8" ry="8" width="130" height="30" fill="#fff" stroke="#d0d7db"/>
  <text x="105" y="119" text-anchor="middle" font-size="11" fill="#7a8288">propensity scores</text>
  <rect x="255" y="100" rx="8" ry="8" width="130" height="30" fill="#fff" stroke="#d0d7db"/>
  <text x="320" y="119" text-anchor="middle" font-size="11" fill="#7a8288">difference-in-diff.</text>
  <rect x="470" y="100" rx="8" ry="8" width="130" height="30" fill="#fff" stroke="#d0d7db"/>
  <text x="535" y="119" text-anchor="middle" font-size="11" fill="#7a8288">doubly robust est.</text>
</svg>
