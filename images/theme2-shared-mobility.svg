<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#494e52"/>
    </marker>
  </defs>
  <!-- Data sources -->
  <rect x="30" y="30" rx="10" ry="10" width="170" height="52" fill="#f2f5f7" stroke="#9baeb8" stroke-width="1.5"/>
  <text x="115" y="52" text-anchor="middle" font-size="12.5" fill="#494e52">GPS trajectories</text>
  <text x="115" y="70" text-anchor="middle" font-size="11" fill="#7a8288">trips &amp; transactions</text>
  <rect x="30" y="104" rx="10" ry="10" width="170" height="52" fill="#f2f5f7" stroke="#9baeb8" stroke-width="1.5"/>
  <text x="115" y="126" text-anchor="middle" font-size="12.5" fill="#494e52">Built environment</text>
  <text x="115" y="144" text-anchor="middle" font-size="11" fill="#7a8288">land use, pricing, weather</text>
  <!-- Models -->
  <rect x="255" y="60" rx="10" ry="10" width="150" height="100" fill="#e8f4f8" stroke="#52adc8" stroke-width="2"/>
  <text x="330" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6f83">Behavioral</text>
  <text x="330" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#2f6f83">Models</text>
  <text x="330" y="136" text-anchor="middle" font-size="11" fill="#4d8a9d">choice models · ML</text>
  <!-- Modes -->
  <g font-size="12" fill="#494e52">
    <rect x="460" y="16" rx="14" ry="14" width="150" height="30" fill="#fff" stroke="#52adc8" stroke-width="1.5"/>
    <text x="535" y="35" text-anchor="middle">ride-hailing / taxi</text>
    <rect x="460" y="58" rx="14" ry="14" width="150" height="30" fill="#fff" stroke="#52adc8" stroke-width="1.5"/>
    <text x="535" y="77" text-anchor="middle">metro</text>
    <rect x="460" y="100" rx="14" ry="14" width="150" height="30" fill="#fff" stroke="#52adc8" stroke-width="1.5"/>
    <text x="535" y="119" text-anchor="middle">e-scooter / bike</text>
    <rect x="460" y="142" rx="14" ry="14" width="150" height="30" fill="#fff" stroke="#52adc8" stroke-width="1.5"/>
    <text x="535" y="161" text-anchor="middle">urban air mobility</text>
  </g>
  <!-- Arrows -->
  <line x1="202" y1="56" x2="253" y2="88" stroke="#494e52" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <line x1="202" y1="130" x2="253" y2="122" stroke="#494e52" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <line x1="407" y1="95" x2="458" y2="40" stroke="#494e52" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <line x1="407" y1="103" x2="458" y2="82" stroke="#494e52" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <line x1="407" y1="117" x2="458" y2="124" stroke="#494e52" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <line x1="407" y1="130" x2="458" y2="166" stroke="#494e52" stroke-width="1.8" marker-end="url(#arrow2)"/>
  <!-- Outcomes strip -->
  <rect x="30" y="200" rx="8" ry="8" width="580" height="34" fill="#f8fafb" stroke="#d0d7db"/>
  <text x="320" y="221" text-anchor="middle" font-size="11.5" fill="#7a8288">nonlinear effects · spatial heterogeneity · mode competition &amp; complementarity · policy evaluation</text>
